name: Windows portable

on:
  push:
    tags: ["windows-v*"]
    branches: ["**"]
    paths:
      - "packaging/windows/**"
      - ".github/workflows/windows-portable.yml"
  workflow_dispatch:
    inputs:
      release_version:
        description: Publish a release with this version (for example 0.1.0). Leave empty to only build.
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "26"
  PNPM_VERSION: "11"
  POSTGRES_VERSION: "18.4-1"
  PGVECTOR_VERSION: "v0.8.7"
  KEPUBIFY_VERSION: "v4.0.4"
  POPPLER_VERSION: "v26.09.0-0"
  FFMPEG_ASSET: "ffmpeg-master-latest-win64-lgpl-shared"

jobs:
  build:
    name: Build portable executable
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      # Publishing a release (and creating its windows-v* tag) needs write access.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          publish=false
          if [[ -n "$RELEASE_VERSION" ]]; then
            if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
              echo "release_version must look like 1.2.3" >&2
              exit 1
            fi
            version="$RELEASE_VERSION"
            publish=true
          elif [[ "$GITHUB_REF" == refs/tags/windows-v* ]]; then
            version="${GITHUB_REF#refs/tags/windows-v}"
            publish=true
          else
            version="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          if [[ "$publish" == true ]] && ! grep -qx "## $version" packaging/windows/CHANGELOG.md; then
            echo "Add a '## $version' bullet list to packaging/windows/CHANGELOG.md before releasing" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          install: "false"

      - name: Install dependencies
        shell: bash
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: pnpm install --frozen-lockfile --filter "server..." --filter "client..."

      - name: Build client
        shell: bash
        run: pnpm --config.verify-deps-before-run=false --filter client run build-only

      - name: Build server
        shell: bash
        run: pnpm --config.verify-deps-before-run=false --filter server run build

      - name: Stage app
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'build/runtime/app'
          pnpm --config.verify-deps-before-run=false --config.allow-unused-patches=true --config.node-linker=hoisted --filter server deploy --prod --legacy $app
          if ($LASTEXITCODE -ne 0) { throw 'pnpm deploy failed' }
          Copy-Item server/dist "$app/dist" -Recurse -Force
          New-Item -ItemType Directory -Force "$app/migrations" | Out-Null
          Copy-Item server/src/db/migrations/* "$app/migrations" -Recurse -Force
          Copy-Item client/dist "$app/public" -Recurse -Force
          Copy-Item client/src/locales "$app/locales" -Recurse -Force
          New-Item -ItemType Directory -Force "$app/koreader-plugin" | Out-Null
          Copy-Item koreader-plugin/bookorbit.koplugin "$app/koreader-plugin/bookorbit.koplugin" -Recurse -Force
          Copy-Item LICENSE, NOTICE, ADDITIONAL_TERMS.md $app -Force
          Remove-Item "$app/bin/kepubify" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$app/bin/kepubify" | Out-Null
          curl.exe -fsSL -o "$app/bin/kepubify/kepubify-windows-64bit.exe" "https://github.com/pgaskin/kepubify/releases/download/$env:KEPUBIFY_VERSION/kepubify-windows-64bit.exe"
          if ($LASTEXITCODE -ne 0) { throw 'kepubify download failed' }
          Remove-Item "$app/src", "$app/test" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force build/runtime/node | Out-Null
          Copy-Item (Get-Command node).Source build/runtime/node/node.exe

      - name: Cache PostgreSQL download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/downloads/postgresql.zip
          key: postgresql-windows-${{ env.POSTGRES_VERSION }}

      - name: Download PostgreSQL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/downloads, build/pg | Out-Null
          if (-not (Test-Path build/downloads/postgresql.zip)) {
            curl.exe -fsSL -o build/downloads/postgresql.zip "https://get.enterprisedb.com/postgresql/postgresql-$env:POSTGRES_VERSION-windows-x64-binaries.zip"
            if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL download failed' }
          }
          & "$env:SystemRoot\System32\tar.exe" -xf build/downloads/postgresql.zip -C build/pg --exclude "pgsql/pgAdmin 4" --exclude "pgsql/doc" --exclude "pgsql/StackBuilder"
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL extract failed' }

      - name: Build pgvector
        shell: cmd
        run: |
          git clone --depth 1 --branch %PGVECTOR_VERSION% https://github.com/pgvector/pgvector.git build\pgvector || exit /b 1
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "PGROOT=%GITHUB_WORKSPACE%\build\pg\pgsql"
          cd build\pgvector
          nmake /NOLOGO /F Makefile.win || exit /b 1
          nmake /NOLOGO /F Makefile.win install || exit /b 1

      - name: Stage PostgreSQL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'build/pg/pgsql'
          $dst = 'build/runtime/pgsql'
          New-Item -ItemType Directory -Force "$dst/bin", "$dst/lib", "$dst/share" | Out-Null
          Copy-Item "$src/bin/*" "$dst/bin" -Recurse -Force
          Remove-Item "$dst/bin/wx*.dll", "$dst/bin/stackbuilder.exe", "$dst/bin/*.lib", "$dst/bin/testplug.dll" -Force -ErrorAction SilentlyContinue
          Copy-Item "$src/lib/*.dll" "$dst/lib" -Force
          Copy-Item "$src/share/*" "$dst/share" -Recurse -Force
          foreach ($dll in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" "$dst/bin" -Force
          }
          Copy-Item "$src/server_license.txt" "$dst/LICENSE.txt" -Force
          if (-not (Test-Path "$dst/lib/vector.dll")) { throw 'vector.dll missing' }
          if (-not (Test-Path "$dst/share/extension/vector.control")) { throw 'vector.control missing' }

      - name: Stage tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/tools-src, build/runtime/tools/ffmpeg/bin, build/runtime/tools/poppler/bin | Out-Null

          gh release download latest --repo BtbN/FFmpeg-Builds --pattern "$env:FFMPEG_ASSET.zip" --dir build/tools-src
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg download failed' }
          & "$env:SystemRoot\System32\tar.exe" -xf "build/tools-src/$env:FFMPEG_ASSET.zip" -C build/tools-src
          Copy-Item "build/tools-src/$env:FFMPEG_ASSET/bin/*" build/runtime/tools/ffmpeg/bin -Force
          Remove-Item build/runtime/tools/ffmpeg/bin/ffplay.exe -Force -ErrorAction SilentlyContinue
          Copy-Item "build/tools-src/$env:FFMPEG_ASSET/LICENSE.txt" build/runtime/tools/ffmpeg/LICENSE.txt -Force -ErrorAction SilentlyContinue

          gh release download $env:POPPLER_VERSION --repo oschwartz10612/poppler-windows --pattern "Release-*.zip" --dir build/tools-src
          if ($LASTEXITCODE -ne 0) { throw 'poppler download failed' }
          $popplerZip = Get-ChildItem build/tools-src/Release-*.zip | Select-Object -First 1
          New-Item -ItemType Directory -Force build/tools-src/poppler | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf $popplerZip.FullName -C build/tools-src/poppler
          $pdftoppm = Get-ChildItem build/tools-src/poppler -Recurse -Filter pdftoppm.exe | Select-Object -First 1
          if (-not $pdftoppm) { throw 'pdftoppm.exe not found in poppler archive' }
          Copy-Item "$($pdftoppm.DirectoryName)/*" build/runtime/tools/poppler/bin -Recurse -Force

          & build/runtime/tools/ffmpeg/bin/ffprobe.exe -version | Select-Object -First 1
          & build/runtime/tools/poppler/bin/pdfinfo.exe -v

      - name: Build executable
        shell: bash
        run: |
          mkdir -p dist-portable
          node packaging/windows/build.mjs \
            --runtime build/runtime \
            --version "${{ steps.version.outputs.version }}" \
            --out "dist-portable/BookOrbit-${{ steps.version.outputs.version }}-windows-x64.exe"

      - name: Smoke test
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path "dist-portable/BookOrbit-$env:VERSION-windows-x64.exe"
          $testDir = Join-Path $env:RUNNER_TEMP 'portable-test'
          New-Item -ItemType Directory -Force $testDir | Out-Null
          Copy-Item $exe "$testDir/BookOrbit.exe"
          $home_ = Join-Path $testDir 'BookOrbit-data'

          function Invoke-Launch([string]$label) {
            $proc = Start-Process -FilePath "$testDir/BookOrbit.exe" -ArgumentList '--no-browser' -WorkingDirectory $testDir -PassThru -NoNewWindow `
              -RedirectStandardOutput "$testDir/$label.out" -RedirectStandardError "$testDir/$label.err"
            $healthy = $false
            for ($i = 0; $i -lt 180; $i++) {
              Start-Sleep -Seconds 5
              if ($proc.HasExited) { break }
              try {
                $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 http://127.0.0.1:6262/api/v1/health
                if ($r.StatusCode -eq 200) { $healthy = $true; break }
              } catch {}
            }
            return @{ Process = $proc; Healthy = $healthy }
          }

          function Show-Logs([string]$label) {
            Write-Host "----- $label stdout -----"; Get-Content "$testDir/$label.out" -ErrorAction SilentlyContinue
            Write-Host "----- $label stderr -----"; Get-Content "$testDir/$label.err" -ErrorAction SilentlyContinue
            Get-ChildItem "$home_/logs" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "----- $($_.Name) -----"; Get-Content $_.FullName -Tail 200
            }
          }

          function Stop-All {
            Get-Process -Name BookOrbit, node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            $pgCtl = Get-ChildItem "$home_/runtime" -Recurse -Filter pg_ctl.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($pgCtl) { & $pgCtl.FullName stop -D "$home_/postgres" -m fast -w 2>&1 | Out-Host }
          }

          $first = Invoke-Launch 'first'
          if (-not $first.Healthy) { Show-Logs 'first'; Stop-All; throw 'First start did not become healthy' }
          Write-Host 'First start is healthy.'

          $settings = @{}
          Get-Content "$home_/bookorbit.env" | Where-Object { $_ -match '^[A-Z_]+=' } | ForEach-Object {
            $k, $v = $_ -split '=', 2; $settings[$k] = $v
          }
          $psql = Get-ChildItem "$home_/runtime" -Recurse -Filter psql.exe | Select-Object -First 1
          $env:PGPASSWORD = $settings['BOOKORBIT_DB_PASSWORD']
          $extensions = & $psql.FullName -h 127.0.0.1 -p 54329 -U bookorbit -d bookorbit -tAc "SELECT string_agg(extname || ' ' || extversion, ', ' ORDER BY extname) FROM pg_extension"
          Write-Host "Extensions: $extensions"
          if ($extensions -notmatch 'vector') { Show-Logs 'first'; Stop-All; throw 'pgvector extension is not installed' }
          $vectorCheck = & $psql.FullName -h 127.0.0.1 -p 54329 -U bookorbit -d bookorbit -tAc "SELECT '[1,2,3]'::vector <-> '[1,2,4]'::vector"
          Write-Host "Vector distance: $vectorCheck"
          if ("$vectorCheck".Trim() -ne '1') { Stop-All; throw 'pgvector query failed' }

          $index = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:6262/
          if ($index.Content -notmatch '<div id="app"') { Show-Logs 'first'; Stop-All; throw 'Client page was not served' }

          function Fail([string]$message) { Show-Logs 'first'; Stop-All; throw $message }
          $api = 'http://127.0.0.1:6262/api/v1'

          $launcherOut = Get-Content "$testDir/first.out" -Raw
          if ($launcherOut -notmatch '/setup#setup-token=') { Fail 'Launcher did not offer the setup page with the token filled in' }
          $status = Invoke-RestMethod "$api/auth/setup-status"
          if (-not $status.needsSetup) { Fail 'Expected a fresh install to need setup' }

          $setupBody = @{ username = 'admin'; name = 'Admin'; email = 'admin@mail.com'; password = 'Sm0keTestPassw0rd' } | ConvertTo-Json
          $session = Invoke-RestMethod -Method Post "$api/auth/setup" -ContentType 'application/json' -Body $setupBody `
            -Headers @{ 'x-setup-token' = $settings['SETUP_BOOTSTRAP_TOKEN'] }
          $auth = @{ Authorization = "Bearer $($session.accessToken)" }

          $drives = Invoke-RestMethod "$api/path/listing?path=%2F" -Headers $auth
          $driveNames = ($drives.entries | ForEach-Object { $_.path }) -join ', '
          Write-Host "Drives listed by the folder picker: $driveNames"
          if ($driveNames -notmatch 'C:\\' -or $driveNames -notmatch 'D:\\') { Fail 'Folder picker did not list the C: and D: drives' }

          $books = Join-Path $env:RUNNER_TEMP 'smoke books\Library'
          New-Item -ItemType Directory -Force $books | Out-Null
          Add-Type -AssemblyName System.IO.Compression, System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::Open((Join-Path $books 'Smoke Test Book.epub'), 'Create')
          function Add-ZipText([string]$name, [string]$text, $level = [System.IO.Compression.CompressionLevel]::Optimal) {
            $writer = New-Object System.IO.StreamWriter(($zip.CreateEntry($name, $level)).Open())
            $writer.Write($text)
            $writer.Dispose()
          }
          Add-ZipText 'mimetype' 'application/epub+zip' ([System.IO.Compression.CompressionLevel]::NoCompression)
          Add-ZipText 'META-INF/container.xml' '<?xml version="1.0"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>'
          Add-ZipText 'content.opf' '<?xml version="1.0" encoding="UTF-8"?><package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="id"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="id">smoke-1</dc:identifier><dc:title>Smoke Test Book</dc:title><dc:creator>Test Author</dc:creator><dc:language>en</dc:language></metadata><manifest><item id="c" href="c.xhtml" media-type="application/xhtml+xml"/><item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/></manifest><spine><itemref idref="c"/></spine></package>'
          Add-ZipText 'c.xhtml' '<?xml version="1.0"?><html xmlns="http://www.w3.org/1999/xhtml"><head><title>c</title></head><body><p>Hello</p></body></html>'
          Add-ZipText 'nav.xhtml' '<?xml version="1.0"?><html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops"><head><title>n</title></head><body><nav epub:type="toc"><ol><li><a href="c.xhtml">c</a></li></ol></nav></body></html>'
          $zip.Dispose()

          $parent = Split-Path $books -Parent
          $listing = Invoke-RestMethod "$api/path/listing?path=$([uri]::EscapeDataString($parent))" -Headers $auth
          if (-not ($listing.entries | Where-Object { $_.path -eq $books })) { Fail "Folder picker did not list $books" }

          $libraryBody = @{ name = 'Smoke'; icon = 'book'; folders = @($books) } | ConvertTo-Json
          $library = Invoke-RestMethod -Method Post "$api/libraries" -ContentType 'application/json' -Body $libraryBody -Headers $auth
          $total = 0
          for ($i = 0; $i -lt 60 -and $total -lt 1; $i++) {
            Start-Sleep -Seconds 3
            $total = (Invoke-RestMethod "$api/libraries/$($library.id)/stats" -Headers $auth).totalBooks
          }
          Write-Host "Books scanned from ${books}: $total"
          if ($total -ne 1) { Fail 'The library on a Windows drive path did not scan its book' }

          $unc = '\\localhost\' + $books.Substring(0, 1) + '$' + $books.Substring(2)
          try {
            $uncListing = Invoke-RestMethod "$api/path/listing?path=$([uri]::EscapeDataString((Split-Path $unc -Parent)))" -Headers $auth
            Write-Host "Network path $unc listing state: $($uncListing.state), entries: $($uncListing.entries.Count)"
          } catch {
            Write-Host "Network path listing not available on this runner: $($_.Exception.Message)"
          }
          Show-Logs 'first'
          Stop-All

          Write-Host 'Restarting against the existing data folder.'
          $second = Invoke-Launch 'second'
          if (-not $second.Healthy) { Show-Logs 'second'; Stop-All; throw 'Second start did not become healthy' }
          Show-Logs 'second'
          Stop-All
          Write-Host 'Smoke test passed.'

      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BookOrbit-windows-x64
          path: dist-portable/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The release notes are this version's bullet list from packaging/windows/CHANGELOG.md.
          awk -v version="$VERSION" '
            /^## / { inside = ($2 == version); next }
            inside && /^- / { print }
          ' packaging/windows/CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "packaging/windows/CHANGELOG.md has no bullet list for $VERSION" >&2
            exit 1
          fi
          gh release create "windows-v${VERSION}" dist-portable/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BookOrbit ${VERSION} for Windows (portable)" \
            --notes-file notes.md
